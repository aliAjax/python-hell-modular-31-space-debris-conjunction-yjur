<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>太空碎片接近协调</title>
<body><h1>太空碎片接近预警与规避协调</h1><p>服务已启动。使用 JSON API 创建接近事件、记录来源、执行评估和协调动作。来源、评估和动作共用一条依据版本链；通知分步持久化派发，失败只重试未完成步骤。</p><pre>GET /health
GET /api/state
POST /api/items
POST /api/items/{id}/sources
POST /api/items/{id}/actions   # action=confirm_source 由协调员确认待确认来源
POST /api/plans/{id}/dispatch  # 续跑通知，已发送步骤不重复</pre></body></html>
